<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>نموذج صرف واستحقاق</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,Arial,sans-serif;background:#ccc;padding:12px;direction:rtl;font-size:13px;}
.mgr{max-width:800px;margin:0 auto 10px;background:#442182;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.mgr-title{color:#fff;font-size:12px;font-weight:700;margin-left:auto;}
.emp-tab{background:rgba(255,255,255,0.2);color:#fff;border:1.5px solid rgba(255,255,255,0.4);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;-webkit-user-select:none;}
.emp-tab.active{background:#fff;color:#442182;}
.del-x{width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;background:rgba(255,255,255,0.25);color:#fff;cursor:pointer;flex-shrink:0;}
.emp-tab.active .del-x{background:#fee;color:#c00;}
.btn-add{background:#fff;color:#442182;border:none;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.toolbar{max-width:800px;margin:0 auto 8px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.tb-btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;}
.tb-print{background:#442182;color:#fff;}
.tb-share{background:#fff;color:#442182;border:1.5px solid #442182;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a2e;color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:9999;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.form-wrap{max-width:800px;margin:0 auto;background:#fff;border:2px solid #000;display:none;}
.form-wrap.active{display:block;}
.f-header{display:grid;grid-template-columns:200px 1fr 200px;border-bottom:1.5px solid #000;min-height:90px;}
.hdr-r{padding:8px 12px;border-left:1.5px solid #000;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:11.5px;font-weight:700;line-height:1.7;text-align:center;}
.hdr-c{padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.hdr-c h1{font-size:16px;font-weight:800;line-height:1.25;}
.hdr-c h1 span{font-size:13px;font-weight:700;}
.hdr-l{padding:6px 10px;border-right:1.5px solid #000;display:flex;align-items:center;justify-content:center;}
.hdr-l img{max-width:190px;max-height:75px;object-fit:contain;}
.f-date{border-bottom:1.5px solid #000;padding:5px 12px;font-size:12px;font-weight:600;text-align:right;}
.sec-hdr{background:#000;color:#fff;padding:5px 12px;display:flex;align-items:center;border-bottom:1.5px solid #000;}
.sec-hdr .ar{font-size:12px;font-weight:700;}
.sec-hdr .en{font-size:12px;font-weight:700;margin-right:auto;direction:ltr;}
.info-tbl{border-bottom:1.5px solid #000;}
.i-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #ccc;}
.i-row:last-child{border-bottom:none;}
.i-cell{padding:5px 10px;display:flex;align-items:center;gap:3px;min-height:30px;}
.i-cell.en{border-left:1.5px solid #000;direction:ltr;text-align:left;}
.lbl{font-weight:700;white-space:nowrap;flex-shrink:0;font-size:12px;}
[contenteditable]{outline:none;border-bottom:1px dashed transparent;min-width:10px;padding:1px 2px;cursor:text;flex:1;font-size:12px;font-family:inherit;-webkit-user-select:text;user-select:text;}
[contenteditable]:focus{border-bottom-color:#442182;background:#f5f0ff;border-radius:2px;}
.stmt-wrap{border-bottom:1.5px solid #000;}
.s-tbl{width:100%;border-collapse:collapse;}
.s-tbl th,.s-tbl td{border:1px solid #bbb;padding:5px 8px;text-align:center;vertical-align:middle;}
.s-tbl thead th{background:#d5d5d5;font-weight:700;font-size:12px;}
.s-tbl .tot td{background:#d5d5d5;font-weight:700;}
.sub{font-size:10px;font-weight:400;display:block;}
.s-tbl td [contenteditable]{display:block;width:100%;min-height:14px;}
.f-notes{border-bottom:1.5px solid #000;min-height:45px;}
.sig-tbl{width:100%;border-collapse:collapse;}
.sig-tbl td{border:1px solid #bbb;padding:4px 6px;vertical-align:middle;font-size:11px;}
.sig-role{background:#d5d5d5;font-weight:700;text-align:center;width:33.33%;}
.sig-name{text-align:center;line-height:1.8;font-size:11px;}
.sig-cv{padding:4px 6px;text-align:center;}
.scw{position:relative;}
canvas.sigpad{width:100%;height:68px;border:1.5px dashed #bbb;background:#fafafa;display:block;touch-action:none;border-radius:3px;cursor:crosshair;}
canvas.sigpad.signed{border-color:#333;border-style:solid;background:#fff;}
canvas.sigpad.locked{border:2px solid #2e7d32 !important;background:#f0fff4 !important;cursor:not-allowed;pointer-events:none;}
.lbdg{display:none;font-size:9px;color:#fff;background:#2e7d32;border-radius:10px;padding:2px 8px;margin-top:3px;font-weight:700;}
.clr-btn{margin-top:3px;width:100%;padding:3px;font-size:10.5px;font-family:inherit;font-weight:600;cursor:pointer;border:1px solid #ccc;border-radius:3px;background:#f5f5f5;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="mgr" id="mgrBar">
  <button class="btn-add" onclick="addEmp()">＋ إضافة موظف</button>
  <span class="mgr-title">نماذج الموظفين</span>
</div>
<div class="toolbar">
  <button class="tb-btn tb-share" onclick="shareLink()">🔗 مشاركة الرابط</button>
  <button class="tb-btn tb-print" onclick="printCurrent()">🖨 طباعة / PDF</button>
</div>

function initSig(cv){
  var ctx=cv.getContext('2d'),drw=false,dpr=window.devicePixelRatio||1;
  function resize(){var r=cv.getBoundingClientRect();if(r.width<10)return;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.scale(dpr,dpr);ctx.strokeStyle='#111';ctx.lineWidth=1.8;ctx.lineCap='round';ctx.lineJoin='round';}
  setTimeout(resize,80);
  function pt(e){var r=cv.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:s.clientX-r.left,y:s.clientY-r.top};}
  function sd(e){if(cv.classList.contains('locked'))return;e.preventDefault();drw=true;var p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
  function dd(e){if(cv.classList.contains('locked'))return;e.preventDefault();if(!drw)return;var p=pt(e);ctx.lineTo(p.x,p.y);ctx.stroke();cv.classList.add('signed');}
  function ed(e){e.preventDefault();drw=false;}
  cv.addEventListener('mousedown',sd);cv.addEventListener('mousemove',dd);cv.addEventListener('mouseup',ed);cv.addEventListener('mouseleave',ed);
  cv.addEventListener('touchstart',sd,{passive:false});cv.addEventListener('touchmove',dd,{passive:false});cv.addEventListener('touchend',ed,{passive:false});
}

function lockCV(cv){
  cv.classList.add('locked');
  var bdg=cv.parentNode.querySelector('.lbdg');
  if(bdg)bdg.style.display='inline-block';
  var btn=cv.closest('.sig-cv').querySelector('.clr-btn');
  if(btn)btn.style.display='none';
}

function clrSig(btn){
  var cv=btn.previousElementSibling.querySelector('canvas.sigpad');
  if(cv.classList.contains('locked'))return;
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
  cv.classList.remove('signed');
}

function todayAr(){
  var d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');
  return (y+'/'+m+'/'+dy).replace(/[0-9]/g,function(n){return'٠١٢٣٤٥٦٧٨٩'[n];});
}

function readData(form){
  var data={};
  form.querySelectorAll('[data-field]').forEach(function(el){data[el.getAttribute('data-field')]=el.innerHTML;});
  data._sigs=[];
  form.querySelectorAll('canvas.sigpad').forEach(function(cv){
    data._sigs.push({img:cv.toDataURL('image/png'),signed:cv.classList.contains('signed'),locked:cv.classList.contains('locked')});
  });
  return data;
}

function writeData(form,data){
  if(!data)return;
  form.querySelectorAll('[data-field]').forEach(function(el){var k=el.getAttribute('data-field');if(data[k]!==undefined)el.innerHTML=data[k];});
  if(data._sigs){
    form.querySelectorAll('canvas.sigpad').forEach(function(cv,i){
      var s=data._sigs[i];
      if(!s||!s.signed)return;
      var im=new Image();
      im.onload=function(){
        var dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();
        if(r.width>0){cv.width=r.width*dpr;cv.height=r.height*dpr;}
        var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
        ctx.drawImage(im,0,0,cv.width/dpr,cv.height/dpr);
        cv.classList.add('signed');
        if(s.locked)lockCV(cv);
      };
      im.src=s.img;
    });
  }
}

function shareLink(){
  if(!activeId||!emps[activeId])return;
  // Lock all signed canvases before sharing
  emps[activeId].form.querySelectorAll('canvas.sigpad.signed:not(.locked)').forEach(lockCV);
  var data=readData(emps[activeId].form);
  try{
    var json=JSON.stringify(data);
    var b64=btoa(unescape(encodeURIComponent(json)));
    var url=window.location.href.split('#')[0]+'#d='+b64;
    if(navigator.share){navigator.share({title:'نموذج صرف واستحقاق',url:url}).catch(function(){});return;}
    if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){showToast('✅ تم نسخ الرابط — أرسليه للتوقيع التالي');}).catch(function(){fbCopy(url);});}
    else{fbCopy(url);}
  }catch(e){showToast('⚠️ الرابط طويل جداً — استخدمي حفظ PDF');}
}

function fbCopy(t){
  var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');showToast('✅ تم نسخ الرابط');}catch(e){showToast('⚠️ تعذّر النسخ');}
  document.body.removeChild(ta);
}

function showToast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3200);
}

function printCurrent(){
  if(!activeId||!emps[activeId])return;
  var form=emps[activeId].form,imgs=[];
  form.querySelectorAll('canvas.sigpad').forEach(function(cv){imgs.push({src:cv.toDataURL('image/png'),signed:cv.classList.contains('signed')});});
  var cl=form.cloneNode(true);
  cl.querySelectorAll('canvas.sigpad').forEach(function(cv,i){
    var im=document.createElement('img');im.src=imgs[i].src;
    im.style.cssText='width:100%;height:68px;border:'+(imgs[i].signed?'1px solid #333':'1px solid #aaa')+';display:block;background:#fff;';
    cv.parentNode.replaceChild(im,cv);
  });
  cl.querySelectorAll('.clr-btn,.lbdg').forEach(function(el){el.remove();});
  cl.querySelectorAll('[contenteditable]').forEach(function(el){el.removeAttribute('contenteditable');});
  var pw=window.open('','_blank','width=850,height=1100');
  if(!pw){alert('يرجى السماح بالنوافذ المنبثقة');return;}
  pw.document.write('<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>نموذج صرف واستحقاق</title><style>'+FORM_CSS+'body{padding:0;margin:0;}@media print{@page{margin:10mm;}}</style></head><body>'+cl.innerHTML+'</body></html>');
  pw.document.close();
  setTimeout(function(){try{pw.focus();pw.print();}catch(e){}},800);
}

function addEmp(data){
  empCount++;
  var id='e'+empCount,wrap=document.createElement('div');
  wrap.className='form-wrap';wrap.id='form_'+id;
  wrap.innerHTML=makeFormHTML();
  document.getElementById('container').appendChild(wrap);
  wrap.querySelector('[data-field="date"]').textContent=todayAr();
  if(data)setTimeout(function(){writeData(wrap,data);},130);
  wrap.querySelectorAll('canvas.sigpad').forEach(initSig);
  var nm=(data&&data.name_ar)?data.name_ar.replace(/<[^>]*>/g,''):'موظف '+empCount;
  var tab=document.createElement('button');
  tab.className='emp-tab';tab.id='tab_'+id;tab.setAttribute('data-id',id);
  tab.innerHTML='<span class="tn">'+nm+'</span><span class="del-x" data-id="'+id+'">✕</span>';
  document.getElementById('mgrBar').insertBefore(tab,document.querySelector('.btn-add'));
  emps[id]={form:wrap,tab:tab};switchTo(id);
  var af=wrap.querySelector('[data-field="name_ar"]');
  if(af)af.addEventListener('input',function(){tab.querySelector('.tn').textContent=this.textContent.trim()||'موظف';});
  return id;
}

function switchTo(id){
  Object.keys(emps).forEach(function(k){emps[k].form.classList.remove('active');emps[k].tab.classList.remove('active');});
  if(emps[id]){emps[id].form.classList.add('active');emps[id].tab.classList.add('active');activeId=id;}
}

document.getElementById('mgrBar').addEventListener('click',function(e){
  var dx=e.target.closest('.del-x'),tab=e.target.closest('.emp-tab');
  if(dx){e.stopPropagation();var id=dx.getAttribute('data-id');
    if(Object.keys(emps).length<=1){alert('لا يمكن حذف الموظف الأخير');return;}
    if(!confirm('حذف هذا الموظف؟'))return;
    emps[id].form.remove();emps[id].tab.remove();delete emps[id];
    var r=Object.keys(emps);if(r.length)switchTo(r[0]);
  }else if(tab){var id=tab.getAttribute('data-id');if(id)switchTo(id);}
});

function loadFromHash(){
  var h=window.location.hash;
  if(h&&h.indexOf('#d=')===0){
    try{
      var b64=h.slice(3),json=decodeURIComponent(escape(atob(b64))),data=JSON.parse(json);
      addEmp(data);showToast('✅ تم تحميل النموذج — التواقيع المحفوظة مقفلة');return true;
    }catch(e){console.error(e);}
  }
  return false;
}

if(!loadFromHash()){
  addEmp(null);
  setTimeout(function(){
    var form=emps[activeId]&&emps[activeId].form;if(!form)return;
    var f={name_en:'Osama Abdelwahab Moharam',name_ar:'محمود رزق احمد جاد',num_en:'29',num_ar:'68',dept_en:'Investment Banking Department',dept_ar:'ادارة العمليات وتقنية المعلومات',job_en:'Senior Advisory &amp; Arrangement Officer',job_ar:'مسؤول الخدمات المساندة',notes_en:'',notes_ar:'',amt:'SAR 1,647.75',stmt_type:'تعويض قيمة التذكرة عن الموظف 1447.75<br>رسوم خروج وعودة للموظف 200 ريال',stmt_name:'اجازة سنوية',total:'SAR 4,543.25'};
    form.querySelectorAll('[data-field]').forEach(function(el){var k=el.getAttribute('data-field');if(f[k]!==undefined)el.innerHTML=f[k];});
    emps[activeId].tab.querySelector('.tn').textContent='محمود رزق احمد جاد';
  },100);
}
